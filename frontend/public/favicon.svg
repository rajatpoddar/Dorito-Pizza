<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Pizza slice favicon — Dorito Pizza & Bakery -->
  <defs>
    <linearGradient id="crust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
  </defs>
  <!-- Pizza base (triangle slice) -->
  <path d="M16 2 L30 28 Q16 32 2 28 Z" fill="#f59e0b" stroke="#d97706" stroke-width="0.5"/>
  <!-- Cheese layer -->
  <path d="M16 5 L27 26 Q16 29.5 5 26 Z" fill="#fbbf24"/>
  <!-- Sauce spots -->
  <circle cx="14" cy="14" r="2" fill="#e11d48" opacity="0.8"/>
  <circle cx="18" cy="18" r="1.8" fill="#e11d48" opacity="0.8"/>
  <circle cx="13" cy="20" r="1.5" fill="#e11d48" opacity="0.8"/>
  <!-- Pepperoni -->
  <circle cx="16" cy="10" r="1.5" fill="#dc2626"/>
  <circle cx="12" cy="17" r="1.3" fill="#dc2626"/>
  <circle cx="19" cy="22" r="1.2" fill="#dc2626"/>
  <!-- Crust highlight -->
  <path d="M16 2 L30 28 Q16 32 2 28 Z" fill="none" stroke="#b45309" stroke-width="1"/>
</svg>
